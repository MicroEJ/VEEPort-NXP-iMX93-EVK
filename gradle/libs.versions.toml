# Build: 7E4D1F7C

[versions]
microej-sdk = "1.8.0"
pack-ui = "14.5.2"

[libraries]
# APIs
api-bon =               { group = "ej.api", name = "bon", version = "1.5.0" }
api-crypto =            { group = "ej.api", name = "crypto", version = "2.3.0" }
api-device =            { group = "ej.api", name = "device", version = "1.4.1" }
api-drawing =           { group = "ej.api", name = "drawing", version = "1.0.6" }
api-edc =               { group = "ej.api", name = "edc", version = "1.3.7" }
api-event =             { group = "ej.api", name = "event", version = "3.0.7" }
api-fs =                { group = "ej.api", name = "fs", version = "2.1.1" }
api-microui =           { group = "ej.api", name = "microui", version = "3.6.1" }
api-net =               { group = "ej.api", name = "net", version = "1.1.4" }
api-ssl =               { group = "ej.api", name = "ssl", version = "2.3.1" }

# Architecture
architecture = { group = "com.microej.architecture.ARMv8A.GNUv113_ARMv8A_32bits_HF_Linux", name = "oliveARMv8A_1", version = "8.6.0" }

# Packs
pack-ui-architecture =  { group = "com.microej.architecture.ARMv8A.GNUv113_ARMv8A_32bits_HF_Linux", name = "oliveARMv8A_1-ui-pack", version.ref = "pack-ui" }
pack-ui =               { group = "com.microej.pack.ui", name = "ui-pack", version.ref = "pack-ui" }
# Packs are fetched from linux-abstraction-layer (see vee-port/build.gradle.kts)

# Libraries
frontpanel-framework =  { group = "ej.tool.frontpanel", name = "framework", version = "1.3.0" }
frontpanel-ui-widget =  { group = "ej.tool.frontpanel", name = "widget", version = "5.4.2" }

# Test Libraries
junit =             { group = "ej.library.test", name = "junit", version = "1.12.0" }
junit-platform =    { group = "org.junit.platform", name = "junit-platform-launcher", version = "1.9.0" }
jenkins =           { group = "com.microej.deploy", name = "jenkins", version = "1.1.1" }

# Testsuites
testsuite-crypto =              { group = "com.microej.pack.crypto", name = "crypto-testsuite", version = "2.3.0" }
testsuite-event =               { group = "com.microej.pack.event", name = "event-testsuite", version = "3.1.0" }
testsuite-fs =                  { group = "com.microej.pack.fs", name = "fs-testsuite", version = "3.0.8" }
testsuite-fs-openjdk =          { group = "com.microej.pack.fs", name = "fs-testsuite-openjdk", version = "1.0.1" }
testsuite-net =                 { group = "com.microej.pack.net", name = "net-1_1-testsuite", version = "4.2.1" }
testsuite-net-openjdk =         { group = "com.microej.pack.net", name = "net-1_1-testsuite-openjdk", version = "1.1.2" }
testsuite-rio =                 { group = "ej.library.runtime", name = "rio-testsuite", version = "0.1.0" }
testsuite-net-rio =             { group = "ej.library.runtime", name = "net-rio-testsuite", version = "0.1.0" }
testsuite-ssl =                 { group = "com.microej.pack.net", name = "net-ssl-2_2-testsuite", version = "6.0.0" }
testsuite-ssl-openjdk =         { group = "com.microej.pack.net", name = "net-ssl-2_2-testsuite-openjdk", version = "3.0.0" }
testsuite-ui =                  { group = "com.microej.pack.ui", name = "ui-testsuite", version.ref = "pack-ui" }
