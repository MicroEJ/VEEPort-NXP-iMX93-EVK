# Properties consumed by the net-rio tests' harness (NetTestHarness / NetTestTools)
# and by rio-testsuite (RioTestTools), mirrored from the java.net net testsuite
# (vee-port/validation/net) so both runners share the same defaults.  The host-side
# peers are wildcard-bound; addressing them over a real interface rather than
# loopback matches the net runner.  Override these for your environment.
microej.java.property.testsuite.preferipv6=false
microej.java.property.remote.machine.ipv4=
microej.java.property.wrong.machine.ipv4=192.168.1.42
microej.java.property.netif.ipv4.name=eth0
microej.java.property.netif.name=eth0
