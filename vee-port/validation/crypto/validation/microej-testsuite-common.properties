# PKCS#11 backend: keys are HSM-backed and never leave the token. OpenSSL pkcs11-provider
# treats provider-backed EVP_PKEY handles as opaque to standard export APIs, so
# EVP_PKEY2PKCS8() returns NULL even when CKA_EXTRACTABLE=TRUE on the token and
# KeyStore.getKey().getEncoded() yields an empty byte[]. Set to false so the round-trip
# assertArrayEquals against the original key bytes is skipped. Harmless on the PKCS#12
# backend (the round-trip would pass, but the rest of the test still validates the entry).
microej.java.property.com.microej.crypto.test.ExternalKeyStoreTest.privatekey.extractable=false
